[project]
name = "meshcore-repeater-info"
version = "0.1.0"
description = "Collect MeshCore repeater status over a Companion radio into an Excel-friendly CSV"
readme = "README.md"
authors = [
    { name = "AleXXX", email = "mail@alexxx.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "cffi>=2.1.1",
    "meshcore>=2.3.17,<3",
    "xlsxwriter>=3.3.1",
]

[project.scripts]
meshcore-repeater-info = "meshcore_repeater_info:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
